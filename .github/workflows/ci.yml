name: ci
on: [push, pull_request]
# Ruling R26: the full home-manager closure (33-37 GB) does not fit a GitHub runner (~14 GB free).
# CI therefore evaluates Nix but never builds the profile, and the distro matrix tests the chezmoi side only.
# tests/overlap.sh needs a built activation package, so it is NOT run here (runs locally / at cutover).
jobs:
  nix-eval:
    runs-on: ubuntu-latest
    env:
      USER: runner
      HOME: /home/runner
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake show ./nix --impure
      # evaluate only (drvPath), never build; no `nix flake check` (it builds the deps checks)
      - run: nix eval --impure --raw ./nix#homeConfigurations.nvidia.activationPackage.drvPath
      - run: nix eval --impure --raw ./nix#homeConfigurations.mesa.activationPackage.drvPath
      - run: nix eval --raw ./nix#nixosConfigurations.nixos-laptop.config.system.build.toplevel.drvPath
      # small in-repo derivation, no heavy closure
      - run: nix build --impure ./nix#otter-launcher
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get install -y jq
      - run: bash tests/placement.sh
      - run: bash tests/orgmanaged.sh
      - run: bash tests/lint.sh
      - run: bash tests/extra-tools-dryrun.sh
      - name: in-home.sh (sentinel mode)
        run: |
          d="$(mktemp -d)"
          bash tests/render.sh tests/data-nvidia-tmux.toml "$d"
          HOME="$d" bash tests/in-home.sh --sentinel
  ops-bats:
    # dots-ops tests (tests/ops). Every tool the tests use is installed here, so a `skip` would hide a real gap:
    # the run fails on any skipped test except the allow-listed /nix one below (R53; a runner has no /nix).
    runs-on: ubuntu-latest
    env:
      YQ_VERSION: v4.47.1
      YQ_SHA256: 0fb28c6680193c41b364193d0c0fc4a03177aecde51cfc04d506b1517158c2fb
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y bats jq perl git util-linux sudo
      - name: install yq (mikefarah v4, pinned)
        run: |
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
      - run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: command -v bats jq yq flock systemd-analyze visudo chezmoi perl git
      # root.bats (units, sudoers, installer static checks) is part of this run; no separate step
      - name: bats tests/ops
        run: |
          rc=0
          bats --tap tests/ops > /tmp/ops.tap || rc=$?
          cat /tmp/ops.tap
          # R53: the only allowed skip is the /nix one (no /nix on a runner); any other skip fails the job
          skips=$(grep -E '^(ok|not ok) .*# skip' /tmp/ops.tap || true)
          allowed='disk-clean-system: /nix present -> nix-collect-garbage # skip no /nix on this host'
          echo "allowed skip: $allowed"
          other=$(printf '%s\n' "$skips" | grep -v '^$' | grep -vF -- "$allowed" || true)
          if [ -n "$other" ]; then echo "::error::unexpected skipped ops tests (install the missing tool):"; echo "$other"; exit 1; fi
          exit "$rc"
  distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "archlinux:latest", "fedora:41", "rockylinux:9"]
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src:ro" ${{ matrix.image }} bash /src/tests/distro-matrix.sh
