# tmux 3.4 only loads the FIRST user config it finds, and ~/.tmux.conf wins over
# ~/.config/tmux/tmux.conf — so load the repo config (github.com/shaiknoorullah/tmux-config)
# from here, then apply machine-local overrides below.
source-file ~/.config/tmux/tmux.conf

# ── Machine-local overrides ──────────────────────────────────────────
set -g extended-keys on

# Show ghostty's background-opacity through tmux — panes use the terminal's (transparent) bg
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# tmux 3.4 does NOT refresh WAYLAND_DISPLAY on attach, so panes (and any claude/wl-paste
# inside them) inherit a blank one → image paste and clipboard reads die inside tmux.
# Refresh WAYLAND_DISPLAY + XDG_RUNTIME_DIR on every attach.
set -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR"
