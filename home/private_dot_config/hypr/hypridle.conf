# hypridle — idle → lock / screen-off. Autostarted from hyprland.lua.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Timeouts are in SECONDS — bump them if a deep-focus reading block locks too soon.

general {
    lock_cmd = pidof hyprlock || hyprlock      # avoid stacking lock instances
    before_sleep_cmd = loginctl lock-session    # lock before the system sleeps
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # wake the screen on resume
    unlock_cmd = ~/.local/bin/adhd-break-end.sh    # end a deliberate break on unlock; turn monitor back on
}

# Lock after 5 minutes idle. A lock you did not declare with Super+Esc is asked about
# on return (timetrack away), so this is also the "forgot to lock" catch.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the screen off 2 minutes after locking; back on with any input.
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 minutes idle: let dots-ops run heavy maintenance (backups, cleanup); stop on any input.
listener {
    timeout = 900
    on-timeout = ~/.local/bin/dots-ops idle-start
    on-resume = ~/.local/bin/dots-ops idle-end
}
