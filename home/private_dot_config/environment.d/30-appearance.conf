# Qt apps have no qt5ct/qt6ct config here and would otherwise render in the light Fusion
# palette while everything else is dark. libqgtk3.so is installed for both Qt5 and Qt6
# (qt5-gtk-platformtheme / qt6-gtk-platformtheme), so point Qt at the GTK settings and it
# inherits gtk-application-prefer-dark-theme from ~/.config/gtk-3.0/settings.ini.
# Harmless where the plugin is absent: Qt logs a warning and falls back to its default.
QT_QPA_PLATFORMTHEME=gtk3
