# Hyprland sessions only: xdg-desktop-portal reads <desktop>-portals.conf for XDG_CURRENT_DESKTOP=Hyprland before the
# generic portals.conf, so GNOME/KDE sessions on the same machine keep their own portal routing.
# Routes only RemoteDesktop to hypr-kdeconnect-fix (Nix package hypr-kdeconnect-fix); ScreenCast, Screenshot and
# GlobalShortcuts go to the Hyprland portal, everything else to gtk (default=gtk, as in the README's Hyprland example).
# Source: "Portal Configuration" in https://github.com/gfhdhytghd/hypr-kdeconnect-fix README (rev 5fc9594).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.RemoteDesktop=hypr-kdeconnect
