<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- dots Icons carries Phosphor outlines at plane-16 codepoints (U+100000+). Appending it
     to the generic families means fontconfig reaches for it ONLY for codepoints the real
     font lacks, so JetBrainsMono keeps every character it already has. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>dots Icons</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>dots Icons</string></edit>
  </match>
</fontconfig>
