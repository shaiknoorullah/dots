# Compressed swap in RAM (systemd zram-generator). Half of RAM, at most 16 GiB. With zstd this typically holds
# ~3x its size in cold anonymous pages, absorbing Blender/Ollama spikes without OOM kills.
# Installed by run_once_before_00-system only when /etc/systemd/zram-generator.conf does not exist yet.
[zram0]
zram-size = min(ram / 2, 16384)
compression-algorithm = zstd
swap-priority = 100
