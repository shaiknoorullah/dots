# dots sshd baseline: written to /etc/ssh/sshd_config.d/40-dots-baseline.conf by the chezmoi root script on every
# non-NixOS machine (org-managed ones included) before sshd is enabled. Key-only login, no root login.
# Same values as dots-ops ssh-harden's 50-dots.conf: sshd keeps the first value it reads, and 40- sorts first.
# On OpenSSH < 8.7 KbdInteractiveAuthentication is written as ChallengeResponseAuthentication.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
